name: Publish npm Wrapper

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a package or only move the latest tag
        required: true
        type: choice
        default: publish
        options:
          - publish
          - set-latest
      version:
        description: "SemVer target version, without leading v"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.operation != 'set-latest' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check package version
        working-directory: packages/npm
        run: |
          node -e "const pkg=require('./package.json'); const want=process.env.VERSION; if (pkg.name !== 'patchxnote-agent') { throw new Error(`unexpected package name ${pkg.name}`); } if (pkg.version !== want) { throw new Error(`package version ${pkg.version} does not match ${want}`); } if (pkg.private) { throw new Error('package must not be private'); }"
        env:
          VERSION: ${{ inputs.version }}

      - name: Check GitHub release assets exist
        run: |
          gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[].name' > /tmp/patchxnote-assets.txt
          for asset in \
            "checksums.txt" \
            "patchxnote_${VERSION}_darwin_amd64" \
            "patchxnote_${VERSION}_darwin_arm64" \
            "patchxnote_${VERSION}_linux_amd64" \
            "patchxnote_${VERSION}_linux_arm64" \
            "patchxnote_${VERSION}_windows_amd64.exe" \
            "patchxnote_${VERSION}_windows_arm64.exe"; do
            grep -Fx "$asset" /tmp/patchxnote-assets.txt
          done
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

      - name: Validate release metadata and select affected tests
        id: validation
        run: |
          node scripts/validate-release-metadata.test.mjs
          node scripts/validate-release-metadata.mjs

      - name: Test npm wrapper
        if: ${{ steps.validation.outputs.wrapper_changed == 'true' }}
        working-directory: packages/npm
        run: npm test

      - name: Check npm package contents
        working-directory: packages/npm
        run: npm pack --dry-run

      - name: npm publish with Trusted Publishing
        working-directory: packages/npm
        run: npm publish --registry https://registry.npmjs.org --access public

  set-latest:
    if: ${{ inputs.operation == 'set-latest' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use npm with trusted dist-tag support
        run: npm install --global npm@11.21.2 --registry https://registry.npmjs.org
      - name: Confirm the target version already exists
        run: |
          actual=$(npm view "patchxnote-agent@${VERSION}" version --registry https://registry.npmjs.org)
          test "$actual" = "$VERSION"
      - name: Set latest with Trusted Publishing
        run: npm dist-tag add "patchxnote-agent@${VERSION}" latest --registry https://registry.npmjs.org
      - name: Verify latest
        run: |
          npm dist-tag ls patchxnote-agent --registry https://registry.npmjs.org > "$RUNNER_TEMP/patchxnote-dist-tags.txt"
          grep -Fx "latest: ${VERSION}" "$RUNNER_TEMP/patchxnote-dist-tags.txt"
