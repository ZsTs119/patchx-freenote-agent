name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      compat_source_tag:
        description: Tagged functional source for a compatibility build
        required: false
        default: v0.2.17
      compat_binary_version:
        description: Set to build compatibility artifacts without publishing a release
        required: false
      compat_build_date:
        description: Optional UTC timestamp to reproduce a locally verified build
        required: false
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".goreleaser.yaml"
      - "server.json"
      - "packages/npm/package.json"
      - "scripts/validate-release-metadata.mjs"
      - "scripts/validate-release-metadata.test.mjs"
      - "scripts/test-branding.sh"
      - "scripts/test-workbuddy-auth.sh"
      - "scripts/test-account-content.sh"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: ${{ !inputs.compat_binary_version }}
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "1"
      GOFLAGS: "-p=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release metadata and select affected tests
        id: validation
        run: |
          node scripts/validate-release-metadata.mjs

      - name: Test release metadata
        if: ${{ steps.validation.outputs.runtime_workbuddy_update_only != 'true' }}
        run: node scripts/validate-release-metadata.test.mjs

      - name: Test branding compatibility
        if: ${{ steps.validation.outputs.runtime_branding_only == 'true' }}
        run: bash scripts/test-branding.sh

      - name: Test WorkBuddy authorization
        if: ${{ steps.validation.outputs.runtime_workbuddy_auth_only == 'true' && steps.validation.outputs.runtime_branding_only != 'true' }}
        run: bash scripts/test-workbuddy-auth.sh

      - name: Test account content compatibility
        if: ${{ steps.validation.outputs.runtime_account_content_only == 'true' }}
        run: bash scripts/test-account-content.sh

      - name: Test
        if: ${{ steps.validation.outputs.runtime_changed == 'true' && steps.validation.outputs.runtime_branding_only != 'true' && steps.validation.outputs.runtime_workbuddy_auth_only != 'true' && steps.validation.outputs.runtime_account_content_only != 'true' }}
        run: go test -p 1 -parallel 1 ./...

      - name: Check GoReleaser config
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Release with GoReleaser
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/checksums.txt
            dist/patchxnote_*

  compatibility:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compat_binary_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.12
      - name: Build sequentially from the selected tag
        env:
          SOURCE_TAG: ${{ inputs.compat_source_tag }}
          BINARY_VERSION: ${{ inputs.compat_binary_version }}
          BUILD_DATE: ${{ inputs.compat_build_date }}
        run: bash scripts/build-compat-binaries.sh "$SOURCE_TAG" "$BINARY_VERSION" dist/compat
      - name: Attest the rebuilt artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/compat/checksums.txt
            dist/compat/patchxnote_*
      - name: Save artifacts for verification before release replacement
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-binaries
          path: dist/compat/
