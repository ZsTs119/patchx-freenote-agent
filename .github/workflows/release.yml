name: Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".goreleaser.yaml"
      - "server.json"
      - "packages/npm/package.json"
      - "scripts/validate-release-metadata.mjs"
      - "scripts/validate-release-metadata.test.mjs"
      - "scripts/test-branding.sh"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOMAXPROCS: "1"
      GOFLAGS: "-p=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release metadata and select affected tests
        id: validation
        run: |
          node scripts/validate-release-metadata.test.mjs
          node scripts/validate-release-metadata.mjs

      - name: Test branding compatibility
        if: ${{ steps.validation.outputs.runtime_branding_only == 'true' }}
        run: bash scripts/test-branding.sh

      - name: Test
        if: ${{ steps.validation.outputs.runtime_changed == 'true' && steps.validation.outputs.runtime_branding_only != 'true' }}
        run: go test -p 1 -parallel 1 ./...

      - name: Check GoReleaser config
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Release with GoReleaser
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/checksums.txt
            dist/patchxnote_*
